[package]
name = "zeroclaw-client"
version = "0.1.0"
edition = "2024"
description = "ZeroClaw gateway client: /ws/chat sessions, REST, loopback mock gateway and the zcprobe CLI"
publish = false

[features]
default = []
mock = ["dep:axum"]

[dependencies]
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
futures-core = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
base64 = "0.23"
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }

[dev-dependencies]
zeroclaw-client = { path = ".", features = ["mock"] }
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "io-util"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "aws_lc_rs", "tls12"] }
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[[bin]]
name = "zcprobe"
path = "src/bin/zcprobe.rs"
