[package]
name = "smart-media"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
eframe = { version="0.37.0", features=["persistence", "serde",  "default_fonts", "glow", "x11", "clipboard"], default-features=false }
egui_extras = { version = "0.37.0", features = ["datepicker", "syntect", "serde", "image", "svg", "all_loaders" ]}
egui-phosphor = { git = "https://github.com/shadowbrok3r/egui-phosphor", branch = "egui-037", default-features = false, features = ["regular"] }
egui-data-table = { git = "https://github.com/shadowbrok3r/egui-data-table", branch = "egui-037", features = ["persistency"]}
egui_dock = { git = "https://github.com/shadowbrok3r/egui_dock", branch = "egui-037", features = ["serde"] }
egui_logger = "0.13"
open = { version = "5.4.4" }
chrono = { version = "0.4", features = ["clock", "std"] }
jiff = "0.2"
humansize = "2"
rfd = { version = "0.17.2" } 
once_cell = "1"
rayon = "1.12.0"
crossbeam = "0.8.5"
tokio = { version = "1", features = ["full"] }
image = { version = "0.25", features = ["serde"] }
base64 = "0.23"
blake3 = "1.8"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
surrealdb = { version = "3", features = ["kv-mem", "kv-surrealkv", "protocol-ws"] }
surrealdb-types = { version = "3" }
anyhow = {  version = "1" }
simplelog = "0.12"
regex = "1.13"
time = { version = "0.3", features = ["macros", "parsing", "formatting"] }
jwalk = "0.9"
candle-core = { version = "0.11.0", features = ["cuda"]}
candle-nn = { version = "0.11.0", features = ["cuda"]}
candle-transformers = { version = "0.11.0", features = ["cuda"]}
candle-examples = { version = "0.11.0", features = ["cuda"]}
tokenizers = { version = "0.23.2", default-features = false, features = ["http", "progressbar", "onig"] }
hf-hub = { version = "1.0.0", default-features = false, features = ["blocking", "rustls-tls"] }
zip = "9.0.5"
egui-toast = { git = "https://github.com/shadowbrok3r/egui-toast", branch = "egui-037" }
egui-theme-kit = { git = "https://github.com/shadowbrok3r/egui-theme-kit", rev = "d462da890f7abb6aa8b7d9cfcf6ab1ed1fc226de", default-features = false, features = ["glass", "files", "dock", "toast", "data-table", "picker", "controls", "title-bar"] }
egui-icon-pack = { git = "https://github.com/shadowbrok3r/egui-theme-kit", rev = "d462da890f7abb6aa8b7d9cfcf6ab1ed1fc226de" }
tar = "0.4.46"
flate2 = { version = "1", features = ["zlib"] }
bzip2 = "0.6"
xz2 = "0.1"
fastembed = { version = "7.1.1" }
sevenz-rust2 = { version = "0.24.1" }
widestring = "1"
rawkit = "0.1"
tempfile = "3"
toml = "0.8"
sha2 = "0.10"
memchr = "2"
fs2 = "0.4"
safetensors = "0.8.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
futures-util = "0.3"
futures-core = "0.3"
infer = "0.22.0"
async-openai = { version = "0.42.2", features = ["byot", "chat-completion", "model"] }
async-trait = "0.1"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "schemars"]}
egui_json_tree = { git = "https://github.com/shadowbrok3r/egui_json_tree", branch = "egui-037", features = ["serde_json"] }

ffmpeg-next = { version = "9", optional = true }

[build-dependencies]
egui-icon-pack-build = { git = "https://github.com/shadowbrok3r/egui-theme-kit", rev = "d462da890f7abb6aa8b7d9cfcf6ab1ed1fc226de" }

[dev-dependencies]
resvg = { version = "0.45", default-features = false }

[features]
cpu = []
ffmpeg = ["ffmpeg-next"]

# Keep windows features for Windows-specific functionality
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
	"Win32_UI_Shell",
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_System_Com",
	"Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
	"Win32_System_Memory",
    "Win32_System_Performance",
	"Win32_System_SystemInformation",
    "UI",
    "UI_Shell",
	"Win32_Graphics_Dxgi"
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
static_vcruntime = "3.0.0"
winres = "0.1"

[dependencies.egui]
version = "0.37.0"
default-features = false
features = ["rayon", "bytemuck", "monochrome_emoji_fonts", "experimental"]

[dependencies.ort]
version = "2.0.0-rc.13"
features = ["cuda"]

[profile.release]
strip = true
# lto = true
panic = "unwind"
debug = false
opt-level = 3

[profile.dev]
strip = false
debug = true
opt-level = 1

[profile.dev.package."*"]
opt-level = 3


[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
libc = "0.2"
